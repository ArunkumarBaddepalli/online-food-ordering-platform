# Local secrets, ignored by git. Optional so the app still starts without it.
spring.config.import=optional:file:./.env.local[.properties]

spring.datasource.url=jdbc:mysql://localhost:3306/food_delivery
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Demo data is seeded by DataSeeder, which only runs on an empty database.
spring.sql.init.mode=never

# An order nobody accepts is cancelled automatically, so the customer is not
# left waiting and the stock goes back on sale.
orders.auto-cancel-enabled=true
orders.auto-cancel-after-minutes=15
orders.auto-cancel-check-millis=60000

# Razorpay test credentials come from .env.local; blank means online payment
# is switched off and checkout offers cash on delivery only.
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
