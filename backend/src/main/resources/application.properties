# Local secrets, ignored by git. Optional so the app still starts without it.
spring.config.import=optional:file:./.env.local[.properties]

spring.datasource.url=jdbc:mysql://localhost:3306/food_delivery
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Demo data is seeded by DataSeeder, which only runs on an empty database.
spring.sql.init.mode=never

# Home delivery needs a rider to carry the order, which is Phase 02. Until then
# the app offers collection only, and the API refuses delivery orders rather
# than merely hiding the option. Flip to true once riders exist.
orders.delivery-enabled=false

# On, now that mail is genuinely delivering. Accounts that existed before
# verification was added are already marked confirmed and are never asked.
orders.require-verified-email=true

# Email. Leave spring.mail.host blank and the app runs normally, logging what
# it would have sent — so a fresh clone works with no credentials. Fill these in
# .env.local to send for real. For Gmail the password is a 16-character app
# password from Google, not the account password, and needs 2-Step Verification.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.mail.from=${MAIL_FROM:no-reply@fooddelivery.local}
app.mail.from-name=Food Delivery
app.base-url=${APP_BASE_URL:http://localhost:3000}

# Demonstration only. Walks orders through their stages on a timer so the whole
# journey can be shown without a second person playing the restaurant. This is
# not how the app works: a real order moves because a restaurant said it did.
# Leave off unless you are presenting.
demo.auto-progress-enabled=false
demo.auto-progress-seconds=30
demo.auto-progress-check-millis=10000

# Razorpay test credentials come from .env.local; blank means online payment
# is switched off and checkout offers cash on delivery only.
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
