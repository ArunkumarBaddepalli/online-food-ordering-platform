# One click deployment: a database, the API, and the site that talks to it.
#
# Render reads this file, creates all three, and wires the database in. The
# values marked sync:false are the ones only you can supply — it will ask for
# them, and none of them are stored in this repository.

databases:
  - name: food-delivery-db
    databaseName: food_delivery
    plan: free

services:
  - type: web
    name: food-delivery-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/config
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: food-delivery-db
          property: connectionString

      # Signs the login tokens. Generated once, here, and never shown in the
      # repository. Changing it signs everybody out.
      - key: JWT_SECRET
        generateValue: true

      # Both halves of this deployment live on onrender.com. Narrow it to the
      # exact address of your site once you know it.
      - key: APP_CORS_ALLOWED_ORIGINS
        value: https://*.onrender.com

      # Where the links in emails should point: the address of your site.
      # Render will ask. Example: https://food-delivery-web.onrender.com
      - key: APP_BASE_URL
        sync: false

      # Leave the mail settings empty and the app still runs, writing the
      # messages it would have sent to the log instead. With them empty, set
      # ORDERS_REQUIRE_VERIFIED_EMAIL to false or nobody can confirm an
      # address, and so nobody can order.
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: ORDERS_REQUIRE_VERIFIED_EMAIL
        value: "true"

      # Razorpay test credentials. Left empty, checkout offers cash only.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false

      # Home delivery needs riders, which is not built yet.
      - key: ORDERS_DELIVERY_ENABLED
        value: "false"

      # Every statement in the log is useful locally and noise in the sky.
      - key: SPRING_JPA_SHOW_SQL
        value: "false"

      # Order times are recorded without a zone, so the server's own zone is
      # what they mean. Hosts run in UTC, which would show every order placed
      # five and a half hours before it was. Change this if your users are
      # somewhere else.
      - key: TZ
        value: Asia/Kolkata

  - type: web
    name: food-delivery-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/build
    envVars:
      # Built with Node 18, as it is locally. Newer versions reject some of the
      # older build tooling this app uses.
      - key: NODE_VERSION
        value: "18.20.8"

      # Baked in when the site is built, so a change here needs a rebuild.
      # Render will ask. Example: https://food-delivery-api.onrender.com
      - key: REACT_APP_API_URL
        sync: false
    routes:
      # Every path is served by the app itself, which does its own routing.
      # Without this, opening any page but the first returns "not found".
      - type: rewrite
        source: /*
        destination: /index.html
